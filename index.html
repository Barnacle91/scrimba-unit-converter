<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="input-section">
        <h1>Metric/Imperial Unit Conversion</h1>
        <input type="number" name="conversion-value" id="conversion-value">
        <button id="convert-btn">Convert</button>
    </div>
    <div id="output-section">
        <div class="conversion-result" id="length-conversion">
            <h2>Length (Meter/Feet)</h2>
            <div class="result" id="length-result">0 meters = 0.000 feet | 0 feet = 0.000 meters</div>
        </div>
        <div class="conversion-result" id="volume-conversion">
            <h2>Volume (Liters/Gallons)</h2>
            <div class="result" id="volume-result">0 liters = 0.000 gallons | 0 gallons = 0.000 liters</div>
        </div>
        <div class="conversion-result" id="mass-conversion">
            <h2>Mass (Kilograms/Pounds)</h2>
            <div class="result" id="mass-result">0 kilos = 0.000 pounds | 0 pounds = 0.000 kilos</div>
        </div>
    </div>

    </div>
    <script src="index.js"></script>
</body>
</html>
